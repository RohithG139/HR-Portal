  # Added 2026-10-16 (Wave 1, real CaseFabric engine connection). The CubeWorks HR app
  # (hr-backend, a separate project — ../../docker-compose.yml) calls this engine using its
  # own Keycloak client-credentials token (realm "cubeworks-hr", client "hr-backend"), not a
  # Dex-issued one. This id is that token's "sub" claim.
  #
  # One registered user for both roles, not two separate people: hr-backend is the only
  # caller for every CubeWorks HR request to this engine (it always acts as this one
  # technical identity — never a per-employee token), and Spring already enforces all real
  # role/ownership checks on its own side (R-API-2) before ever calling here. These tenant
  # roles exist so the employeecase case-team's HR/ITAdmin tenant-role entries resolve to a
  # real registered member, not for the engine to gatekeep anything by role.
  #
  # NOT actually a fixed value (corrected 2026-10-18 — see hr-backend's application.yml,
  # cubeworks.engine.service-account-user-id, for the full story): Keycloak's dev-mode realm
  # state is not volume-mounted, so this id changes whenever Keycloak regenerates the
  # hr-backend client's service account (e.g. a realm re-import on `docker compose restart
  # keycloak`). This file is ALSO only consulted the very first time the "world" tenant is
  # bootstrapped — an already-running engine logs "Bootstrap tenant 'world' already exists;
  # ignoring bootstrap info" and never re-reads this file again. So on a fresh environment this
  # value may already be stale by the time the engine first starts; always verify the real id
  # live (Keycloak admin API: GET .../clients/{id}/service-account-user) rather than trusting
  # this file, and if the engine's "world" tenant already exists, register the real id directly
  # via POST /tenant/world/users (as an existing tenant owner) instead of relying on this file.
  id = "b9d462ff-4185-44be-83fa-7beae8250602"
  name = "cubeworks-hr-backend"
  email = "hr-backend@cubeworks.internal"
  roles = ["HR", "ITAdmin"]
}]
