# CubeWorks HR login theme (S13, wireframe `#login-view`).
#
# Extends keycloak.v2, confirmed live (2026-10-16) as the realm's actual default
# login theme (the rendered login page's resource paths point at
# "resources/<cache-key>/login/keycloak.v2") — not the older "keycloak" theme,
# which the initial plan had assumed without checking.
#
# 2026-10-17: added css/login.css (visual restyle to match the wireframe's light
# theme + brand colors, replacing keycloak.v2's default dark/PatternFly look) and
# a login.ftl override (adds required=true to the two S13 fields for the "*"
# markers the wireframe shows). "css/styles.css" is listed first so keycloak.v2's
# own small override sheet still loads (Keycloak falls back through the parent
# chain for resources this theme doesn't have its own copy of); our sheet loads
# after it, so later rules win on the shared selectors.
parent=keycloak.v2
styles=css/styles.css css/login.css
