# CubeWorks HR — FRD-01 §5 exact login/password wording (R-SRC-3: messages are copied
# exactly from the FRD, including punctuation). Every key below was checked against the
# live Keycloak 26.0.8 container's own theme/base/login/messages/messages_en.properties
# bundle on 2026-10-16 (extracted from org.keycloak.keycloak-themes-26.0.8.jar) so none
# silently falls back to Keycloak's default text through a misspelled key.
#
# S13 — login form (spec.md §4 S13 table)
missingUsernameMessage=Enter your e-mail address.
missingPasswordMessage=Enter your password.
#
# S13 — visual text from the wireframe (`#login-view`: "Login" title, "E-mail
# address*" field, "[LOGIN]" button). Default keycloak.v2 text is "Sign in to
# your account" / "Username or email" / "Sign In" (theme/base/login/messages,
# confirmed live 2026-10-17); registrationEmailAsUsername stays false (D-02's
# username IS the private e-mail already, this only relabels the field).
loginAccountTitle=Login
usernameOrEmail=E-mail address
doLogIn=Login
# WS-04: never reveal which part was wrong, or whether the account exists — both the
# wrong-e-mail and wrong-password cases use the same combined message.
invalidUserMessage=Invalid e-mail or password.
invalidPasswordMessage=Invalid e-mail or password.
#
# Forgot/reset password (FRD-01 §5 message table)
notMatchPasswordMessage=The passwords do not match.
# Shown when the user clicks a reset-password/set-password link after it has expired,
# with or without an existing Keycloak session (both map to the same FRD wording).
expiredActionTokenNoSessionMessage=This link has expired. Use Forgot password or ask HR to resend it.
expiredActionTokenSessionExistsMessage=This link has expired. Use Forgot password or ask HR to resend it.
emailSentMessage=If this e-mail address is known, we have sent a reset link.
# New-password policy: the FRD gives one combined message ("Use at least 12 characters,
# with at least one letter and one number.") for the length(12)+letter+digit rule
# (realised as a single regexPattern policy clause, see cubeworks-hr-realm.json) and
# never gives separate wording for the "not the same as the e-mail address" sub-rule, so
# that failure reuses the same message rather than leaking Keycloak's own generic text.
invalidPasswordRegexPatternMessage=Use at least 12 characters, with at least one letter and one number.
invalidPasswordNotEmailMessage=Use at least 12 characters, with at least one letter and one number.
